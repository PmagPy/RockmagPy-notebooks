name: deploy-book

# Only run this when the master branch changes
on:
  push:
    branches:
    - main

# This job installs dependencies, build the book, and pushes it to `gh-pages`
jobs:
  deploy-book:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    # Install dependencies
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies manually
      run: |
        pip install future matplotlib pandas requests seaborn "jupyter-book==1.0.4.post1" scikit-learn ipywidgets
        pip install cartopy==0.22
        pip install pmagpy==4.2.106
    - name: Clean previous build
      run: |
        jupyter-book clean .  
    # Build the book
    - name: Build the book
      run: |
        jupyter-book build .
        # Guard: never publish an empty build (which silently wipes the live site)
        test -f _build/html/index.html || { echo "::error::Build produced no _build/html/index.html — refusing to deploy"; exit 1; }
    # Push the book's HTML to github-pages
    - name: GitHub Pages action
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./_build/html
